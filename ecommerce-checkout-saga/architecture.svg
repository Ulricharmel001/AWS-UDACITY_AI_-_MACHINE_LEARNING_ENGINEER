<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470">
  <rect width="820" height="470" fill="#0f172a"/>
  <text x="410" y="35" fill="#f8fafc" font-size="21" font-weight="bold" text-anchor="middle">E-Commerce Checkout Saga</text>

  <rect x="300" y="60" width="220" height="52" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="410" y="82" fill="#e2e8f0" font-size="14" text-anchor="middle">CheckoutSagaTable</text>
  <text x="410" y="101" fill="#94a3b8" font-size="11" text-anchor="middle">checkout_id (PK) | state | lock | barrier</text>

  <rect x="300" y="150" width="220" height="52" rx="10" fill="#1e293b" stroke="#a78bfa"/>
  <text x="410" y="172" fill="#e2e8f0" font-size="14" text-anchor="middle">Checkout Orchestrator</text>
  <text x="410" y="191" fill="#94a3b8" font-size="11" text-anchor="middle">forward → compensate in reverse</text>

  <line x1="410" y1="112" x2="410" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="260" width="210" height="70" rx="10" fill="#1e293b" stroke="#34d399"/>
  <text x="165" y="286" fill="#e2e8f0" font-size="14" text-anchor="middle">InventoryAgent</text>
  <text x="165" y="307" fill="#94a3b8" font-size="11" text-anchor="middle">release_items / compensate</text>

  <rect x="305" y="260" width="210" height="70" rx="10" fill="#1e293b" stroke="#fbbf24"/>
  <text x="410" y="286" fill="#e2e8f0" font-size="14" text-anchor="middle">PaymentAgent</text>
  <text x="410" y="307" fill="#94a3b8" font-size="11" text-anchor="middle">charge_card / refund_card</text>

  <rect x="550" y="260" width="210" height="70" rx="10" fill="#1e293b" stroke="#f472b6"/>
  <text x="655" y="286" fill="#e2e8f0" font-size="14" text-anchor="middle">ShippingAgent</text>
  <text x="655" y="307" fill="#94a3b8" font-size="11" text-anchor="middle">schedule_shipping / cancel</text>

  <line x1="360" y1="202" x2="165" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="202" x2="410" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="202" x2="655" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="380" width="700" height="58" rx="10" fill="#172033" stroke="#475569"/>
  <text x="410" y="404" fill="#cbd5e1" font-size="13" text-anchor="middle">Failure path: acquire lock → compensate completed steps in reverse → increment barrier</text>
  <text x="410" y="425" fill="#94a3b8" font-size="11" text-anchor="middle">compensations_completed == compensations_needed → status resolved</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
